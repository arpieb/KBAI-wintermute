[project]
name = "wintermute"
version = "2.0.0"
description = "KBAI conversational agent (CS 7637, FA 2016), modernized for Python 3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "en-core-web-sm",
    "ladybug>=0.22.3",
    "requests>=2.34.2",
    "slack-bolt>=1.30.0",
    "spacy>=3.8.18",
]

[project.scripts]
wintermute = "wintermute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
